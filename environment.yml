name: maestro
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.11

  # Core ML Framework (PyTorch with CUDA support)
  - pytorch==2.2.2
  - pytorch-cuda=12.1
  - pytorch-lightning==2.2.1
  - lightning==2.2.2

  # Vision Transformers & SSL
  - einops==0.7.0
  - transformers==4.44.2

  # Config & CLI
  - omegaconf==2.3.0
  - hydra-core=1.3
  - dacite==1.9.2

  # Geospatial Data
  - geopandas==0.14.3
  - rasterio==1.3.9
  - pyogrio==0.10.0
  - pyarrow==18.1.0

  # Data Processing
  - h5py==3.12.1
  - requests==2.31.0
  - opencv==4.11.0

  # Experiment Tracking & Logging
  - tensorboard==2.16.2
  - python-dotenv==1.0.1

  # Visualization
  - matplotlib==3.10.0
  - seaborn==0.13.2

  # Utilities
  - ipython==8.23.0

  # pip-only packages
  - pip
  - pip:
      - vit-pytorch==1.6.5
      - jsonargparse[signatures]==4.27.7
      - hydra-zen==0.13.0
      - clearml==1.15.1
      - terratorch==1.1
      - dacite==1.9.2